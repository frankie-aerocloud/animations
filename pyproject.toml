[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs Blender or FFmpeg; skipped automatically when the tool is missing"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["studio.py", "studio/characters", "studio/environments", "studio/blender/story_scenes.py", "scripts/blender"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["studio"]
exclude = ["studio/(blender|assets|characters|environments)/"]
ignore_missing_imports = true
