name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # FFmpeg 9.0.2, as on the Macs; BtbN keeps its month-end builds for about two years
  FFMPEG_RELEASE: autobuild-2026-10-31-12-59
  FFMPEG_BUILD: ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0
  FFMPEG_SHA256: 73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3

jobs:
  checks:
    name: Lint, types, tests, project validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}

      - name: Install FFmpeg (some fast tests skip without it)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}.tar.xz" -o ffmpeg.tar.xz
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm ffmpeg.tar.xz

      - name: Add FFmpeg to PATH
        run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check studio tests

      - name: Mypy
        run: python -m mypy

      - name: Pytest (fast suite, no Blender)
        run: python -m pytest -q -m "not slow"

      - name: Validate every production
        run: |
          status=0
          for storyboard in projects/*/storyboard.yaml; do
            python -m studio.cli validate "$(dirname "$storyboard")" || status=1
          done
          exit $status
