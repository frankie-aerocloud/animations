name: Render films

# Each scene renders independently, then a per-film job assembles the verified intermediate clips.
# Run manually for a chosen project/profile, or push a v* tag to render every film at standard quality.
# GitHub recommends self-hosted runners only for private repositories: this one is public, and a
# fork's pull request can change a workflow to run on them.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Production to render
        type: choice
        default: all
        options: [all, water-crisis, seagulls-nyc, vegas-lions, london-rain, la-wind, plastic-pause, burger-boycott]
      profile:
        description: Render profile
        type: choice
        default: preview
        options: [preview, standard, high]
      runner:
        description: Hosted CPU, any self-hosted runner, or a self-hosted runner labelled "gpu"
        type: choice
        default: github-hosted
        options: [github-hosted, self-hosted, self-hosted-gpu]
      parallel_scenes:
        description: Maximum scene jobs to run concurrently
        type: choice
        default: "4"
        options: ["1", "2", "4", "8", "16"]
      publish:
        description: Attach finished films to a GitHub Release named render-<run number>
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.3"
  BLENDER_SHA256: 78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec
  # FFmpeg 9.0.2, as on the Macs; BtbN keeps its month-end builds for about two years
  FFMPEG_RELEASE: autobuild-2026-10-31-12-59
  FFMPEG_BUILD: ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0
  FFMPEG_SHA256: 73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3
  PIPER_VOICE: en_GB-cori-high
  PIPER_VOICE_SHA256: 470b4dd634c98f8a4850d7626ffc3dfc90774628eeef6605a6dd8f88f30a5903
  PIPER_CONFIG_SHA256: 9e7fb5b5671612c22f3c81cbe46c1ae87b031a4632bcb509e499dad6f1e2adec
  PROFILE: ${{ inputs.profile || 'standard' }}
  RENDER_RUNNER: ${{ inputs.runner || 'github-hosted' }}

jobs:
  plan:
    name: Plan scene matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      scenes: ${{ steps.matrix.outputs.scenes }}
      runner_labels: ${{ steps.matrix.outputs.runner_labels }}
      timeout: ${{ steps.matrix.outputs.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Read storyboards
        run: python -m pip install PyYAML==6.0.3

      - name: Build project and scene matrices
        id: matrix
        env:
          SELECTED_PROJECT: ${{ inputs.project || 'all' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          known = sorted(path.parent.name for path in Path("projects").glob("*/storyboard.yaml"))
          selected = os.environ["SELECTED_PROJECT"]
          projects = known if selected == "all" else [selected]
          unknown = set(projects) - set(known)
          if unknown:
              raise SystemExit(f"Unknown project(s): {', '.join(sorted(unknown))}")

          scene_rows = []
          for project in projects:
              storyboard = yaml.safe_load(
                  Path(f"projects/{project}/storyboard.yaml").read_text(encoding="utf-8")
              )
              for scene in storyboard["scenes"]:
                  scene_rows.append({"project": project, "scene": str(scene["id"])})
          if len(scene_rows) > 256:  # GitHub's limit on jobs from one matrix
              raise SystemExit(f"{len(scene_rows)} scenes exceed the 256-job matrix limit; render fewer projects per run")

          runner = os.environ["RENDER_RUNNER"]
          if runner == "self-hosted-gpu":
              labels = ["self-hosted", "gpu"]
          elif runner == "self-hosted":
              labels = ["self-hosted"]
          else:
              labels = ["ubuntu-24.04"]

          compact = (",", ":")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("projects=" + json.dumps(
                  {"include": [{"project": project} for project in projects]}, separators=compact
              ), file=output)
              print("scenes=" + json.dumps({"include": scene_rows}, separators=compact), file=output)
              print("runner_labels=" + json.dumps(labels, separators=compact), file=output)
              print("timeout=" + ("4320" if runner.startswith("self-hosted") else "355"), file=output)
          print(f"Planned {len(scene_rows)} scenes across {len(projects)} project(s)")
          PY

  render-scenes:
    name: ${{ matrix.project }} / ${{ matrix.scene }}
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_labels) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel_scenes || '4') }}
      matrix: ${{ fromJSON(needs.plan.outputs.scenes) }}
    env:
      PROJECT: ${{ matrix.project }}
      SCENE: ${{ matrix.scene }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.RENDER_RUNNER == 'github-hosted'
        with:
          python-version: "3.13"

      - name: Install hosted-runner system packages
        if: env.RENDER_RUNNER == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libxrender1 libxcb1 xz-utils curl

      - name: Cache Blender
        if: env.RENDER_RUNNER == 'github-hosted'
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Install Blender
        if: env.RENDER_RUNNER == 'github-hosted' && steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          major_minor="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${major_minor}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o blender.tar.xz
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          rm blender.tar.xz

      - name: Cache FFmpeg
        if: env.RENDER_RUNNER == 'github-hosted'
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}

      - name: Install FFmpeg
        if: env.RENDER_RUNNER == 'github-hosted' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}.tar.xz" -o ffmpeg.tar.xz
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm ffmpeg.tar.xz

      - name: Add hosted tools to PATH
        if: env.RENDER_RUNNER == 'github-hosted'
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Install scene-render Python dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install PyYAML==6.0.3

      - name: Check render tools
        run: |
          blender --version | head -n 1
          ffmpeg -version | head -n 1
          .venv/bin/python -m studio.cli validate "projects/$PROJECT"

      - name: Report self-hosted GPU backend
        if: env.RENDER_RUNNER == 'self-hosted-gpu'
        continue-on-error: true
        run: |
          command -v nvidia-smi >/dev/null && nvidia-smi || true
          blender -b --factory-startup --python-expr \
            "import gpu; print('[graphics]', gpu.platform.vendor_get(), gpu.platform.renderer_get(), gpu.platform.version_get())"

      - name: Render and encode scene
        run: |
          command=(.venv/bin/python -m studio.cli render-scene "projects/$PROJECT" \
            --profile "$PROFILE" --scene "$SCENE" --encode-clip)
          if [ "$RENDER_RUNNER" = "github-hosted" ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" "${command[@]}"
          else
            "${command[@]}"
          fi

      - name: Pack verified scene clip
        run: |
          base="output/$PROJECT/scenes/$SCENE/$PROFILE"
          for file in scene.hash deps.json clip.hash clip.mp4; do
            test -s "$base/$file" || { echo "Missing $base/$file"; exit 1; }
          done
          archive="scene-$PROJECT-$PROFILE-$SCENE.tar"
          tar -cf "$archive" \
            "$base/scene.hash" "$base/deps.json" "$base/clip.hash" "$base/clip.mp4"

      - name: Upload scene clip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scene-${{ matrix.project }}-${{ env.PROFILE }}-${{ matrix.scene }}
          path: scene-${{ matrix.project }}-${{ env.PROFILE }}-${{ matrix.scene }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload scene log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.project }}-${{ env.PROFILE }}-${{ matrix.scene }}
          path: output/${{ matrix.project }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    name: Assemble ${{ matrix.project }}
    needs: [plan, render-scenes]
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_labels) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.RENDER_RUNNER == 'github-hosted'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install hosted-runner system packages
        if: env.RENDER_RUNNER == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libxrender1 libxcb1 xz-utils curl

      - name: Restore Blender
        if: env.RENDER_RUNNER == 'github-hosted'
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Install Blender if cache is empty
        if: env.RENDER_RUNNER == 'github-hosted' && steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          major_minor="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${major_minor}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o blender.tar.xz
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          rm blender.tar.xz

      - name: Restore FFmpeg
        if: env.RENDER_RUNNER == 'github-hosted'
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}

      - name: Install FFmpeg if cache is empty
        if: env.RENDER_RUNNER == 'github-hosted' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}.tar.xz" -o ffmpeg.tar.xz
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm ffmpeg.tar.xz

      - name: Add hosted tools to PATH
        if: env.RENDER_RUNNER == 'github-hosted'
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Install Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Cache Piper voice
        id: voice-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/voices
          key: piper-${{ env.PIPER_VOICE }}-${{ env.PIPER_VOICE_SHA256 }}

      - name: Download Piper voice
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: .venv/bin/python -m piper.download_voices "$PIPER_VOICE" --download-dir assets/voices

      - name: Verify Piper voice checksums
        run: |
          verify() {
            if command -v sha256sum >/dev/null; then sum=$(sha256sum "$1" | cut -d' ' -f1)
            else sum=$(shasum -a 256 "$1" | cut -d' ' -f1); fi
            test "$sum" = "$2" || { echo "Checksum mismatch for $1: $sum"; exit 1; }
          }
          verify "assets/voices/${PIPER_VOICE}.onnx" "$PIPER_VOICE_SHA256"
          verify "assets/voices/${PIPER_VOICE}.onnx.json" "$PIPER_CONFIG_SHA256"

      - name: Download scene clips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scene-${{ matrix.project }}-${{ env.PROFILE }}-*
          path: scene-artifacts
          merge-multiple: true

      - name: Restore scene clip tree
        run: |
          count=0
          for archive in scene-artifacts/*.tar; do
            tar -xf "$archive"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "No scene archives were downloaded"; exit 1; }
          echo "Restored $count scene clips"

      - name: Check assembly tools
        run: .venv/bin/python -m studio.cli doctor

      - name: Assemble from fingerprinted clips
        run: |
          command=(.venv/bin/python -m studio.cli assemble "projects/$PROJECT" \
            --profile "$PROFILE" --from-clips)
          if [ "$RENDER_RUNNER" = "github-hosted" ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" "${command[@]}"
          else
            "${command[@]}"
          fi

      - name: Check finished MP4
        run: .venv/bin/python -m studio.cli check "projects/$PROJECT" --profile "$PROFILE"

      - name: Collect deliverables
        run: |
          out="output/$PROJECT"
          mkdir -p dist
          cp "$out/$PROJECT-$PROFILE.mp4" "dist/"
          cp "$out/subtitles.srt" "dist/$PROJECT-$PROFILE.srt"
          cp "$out/manifest-$PROFILE.json" "dist/$PROJECT-$PROFILE-manifest.json"

      - name: Upload finished film
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: film-${{ matrix.project }}-${{ env.PROFILE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload assembly logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-assemble-${{ matrix.project }}-${{ env.PROFILE }}
          path: output/${{ matrix.project }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: film-*-${{ inputs.profile || 'standard' }}
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            gh release create "$tag" release/* --title "$tag" --generate-notes
          else
            tag="render-${GITHUB_RUN_NUMBER}"
            gh release create "$tag" release/* --target "$GITHUB_SHA" \
              --title "Render $GITHUB_RUN_NUMBER (${{ inputs.profile }})" \
              --notes "Films rendered from $GITHUB_SHA at the ${{ inputs.profile }} profile."
          fi
