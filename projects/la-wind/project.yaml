id: la-wind
title: "When The Wind Took Everything"
language: en-GB
hud_label: "LOS ANGELES"
hud_wrap: 24           # time-of-day clock from 06:00 round to 06:00 the next morning
music_style: tense
premise: >
  Hypothetical 24-hour disaster. A 300 mph wind tears through Los Angeles from one sunrise to the next.
  Outside, the city is ripped apart; inside, families shelter and wait for the walls to hold.
