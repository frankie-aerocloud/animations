    lighting: soft_daylight
    lighting_overrides: *sunny
    camera: {shot: push_in, from: [12.3, -41, 1.6], to: [12.1, -39, 1.6], look: [0, 20, 8], look_to: [0, 20, 8], lens: 26, fstop: 5}
    hud: {hours: 6.08, sub: "WIND CALM"}
