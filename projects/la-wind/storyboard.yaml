# When The Wind Took Everything: sunny Los Angeles torn apart by a 300 mph wind for 24 hours, while
# people shelter inside. Coordinates: metres in each environment (studio/blender/environments_la.py).
# Streets run along Y; US traffic keeps right. The wind blows toward -X. hud values are hours of the
# day (project hud_wrap: 24): 26 is 02:00 and 30 is 06:00 the next morning.
x-sunny: &sunny {sun: 5.5, elevation: 18, azimuth: 70, colour: [1.0, 0.90, 0.76], zenith: [0.16, 0.38, 0.86], horizon: [0.72, 0.80, 0.90], ambient: 0.6, fog: 0.0006, fog_colour: [0.88, 0.86, 0.80], exposure: -0.3}
x-dusty: &dusty {sun: 2.6, elevation: 30, azimuth: 70, colour: [1.0, 0.82, 0.62], zenith: [0.40, 0.38, 0.34], horizon: [0.70, 0.60, 0.45], ambient: 0.65, fog: 0.004, fog_colour: [0.70, 0.58, 0.42], exposure: -0.1}
x-dusty-air: &dusty_air {sun: 2.6, elevation: 30, azimuth: 70, colour: [1.0, 0.82, 0.62], zenith: [0.40, 0.38, 0.34], horizon: [0.70, 0.60, 0.45], ambient: 0.65, fog: 0.0009, fog_colour: [0.70, 0.58, 0.42], exposure: -0.1}
x-dusk-fire: &dusk_fire {sun: 2.0, elevation: 4, azimuth: -100, colour: [1.0, 0.45, 0.20], zenith: [0.10, 0.08, 0.14], horizon: [0.80, 0.35, 0.15], ambient: 0.4, fog: 0.004, fog_colour: [0.55, 0.30, 0.18], exposure: 0.15}
x-dark: &dark {sun: 0.15, elevation: 35, azimuth: 60, colour: [0.55, 0.62, 0.85], zenith: [0.01, 0.012, 0.02], horizon: [0.04, 0.035, 0.035], ambient: 0.2, fog: 0.003, fog_colour: [0.10, 0.08, 0.07], exposure: 0.6}
x-dark-air: &dark_air {sun: 0.15, elevation: 35, azimuth: 60, colour: [0.55, 0.62, 0.85], zenith: [0.01, 0.012, 0.02], horizon: [0.04, 0.035, 0.035], ambient: 0.2, fog: 0.0006, fog_colour: [0.10, 0.08, 0.07], exposure: 0.6}
x-sunrise: &sunrise {sun: 4.0, elevation: 6, azimuth: 80, colour: [1.0, 0.68, 0.42], zenith: [0.22, 0.40, 0.75], horizon: [0.98, 0.72, 0.50], ambient: 0.5, fog: 0.0012, fog_colour: [0.95, 0.80, 0.62], exposure: -0.05}
x-sunrise-air: &sunrise_air {sun: 4.0, elevation: 6, azimuth: 80, colour: [1.0, 0.68, 0.42], zenith: [0.22, 0.40, 0.75], horizon: [0.98, 0.72, 0.50], ambient: 0.5, fog: 0.0004, fog_colour: [0.95, 0.80, 0.62], exposure: -0.05}
x-indoor: &indoor {sun: 2.5, elevation: 25, azimuth: 160, colour: [1.0, 0.90, 0.75], zenith: [0.30, 0.50, 0.85], horizon: [0.75, 0.80, 0.85], ambient: 0.45, exposure: 0.0}
scenes:
  # ----- 06:00 AM: THE WARNING -----------------------------------------------------------------
  - id: s01_dawn
    duration: 5.56
    environment: {type: la_aerial}
    lighting: soft_daylight
    lighting_overrides: *sunny
    camera: {shot: aerial_establish, from: [-1800, -2200, 700], to: [-1700, -2050, 660], look: [0, 1200, 120], look_to: [0, 1150, 110], lens: 28, fstop: 8}
    captions:
      - {kind: title, text: "WHEN THE WIND TOOK EVERYTHING", at: 0.2, until: 2.8}
      - {kind: chapter, text: "06:00 AM", sub: "The warning", at: 2.9, until: 5.4}
    hud: {hours: 6.0, show_at: 0.3, sub: "WIND CALM"}
    sfx: [{sound: swell, at: 0.1, gain_db: -8}]
    music: {intensity: 0.2}
    transition: {type: dissolve, duration: 0.3}

  - id: s02_alert
    duration: 5.10
    environment: {type: la_interior, kind: living, people: 3, wind: 0.0}
    lighting: interior_day
    lighting_overrides: *indoor
    camera: {shot: push_in, from: [-2.7, 0.9, 1.55], to: [-2.3, 1.3, 1.5], look: [1.6, 4.2, 1.2], look_to: [1.6, 4.2, 1.2], lens: 22, fstop: 3.5}
    captions:
      - {kind: alert, text: "Extreme wind warning. Shelter indoors now.", at: 0.5, until: 5.2}
    hud: {hours: 6.03, sub: "WARNING ISSUED"}
    sfx: [{sound: alert, at: 0.5, gain_db: -4}]
    music: {intensity: 0.35}
    transition: {type: cut, duration: 0.0}

  - id: s03_calm
