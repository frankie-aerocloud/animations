assets:
  - id: procedural_asset_library
    type: geometry
    path: studio/assets
    source: "Project-original procedural builders (buildings, characters, Los Angeles palms, buildings and landmarks, wind, vehicles, props, water)"
    licence: "Project original"
  - id: la_environments
    type: geometry
    path: studio/blender/environments_la.py
    source: "Project-original Los Angeles streets, freeway, hills, downtown, airport, pier and interiors (stylised, not survey-accurate)"
    licence: "Project original"
  - id: inter_font
