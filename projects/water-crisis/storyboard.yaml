# One entry per shot. Times inside a scene are seconds from the scene start. Coordinates are metres in the
# environment's world space (see studio/blender/environments.py for each layout and its named anchors).
# Story clock: the scenario starts at 07:00, so hour 12 is dusk, hours 15-20 are night and hour 24 is dawn.
scenes:
  - id: s01_hook
    duration: 10.0
    environment: {type: coastal_city, seed: 11, people: 16, traffic: 10}
    lighting: soft_daylight
    camera: {shot: aerial_establish, from: [-70, -190, 110], to: [-14, -82, 52], look: [10, 30, 10], look_to: [0, 0, 4], lens: 30, fstop: 8, whip_out: {duration: 0.4}}
    events:
      - {type: flash, at: 5.8, amount: 3.0}
      - {type: water_level, target: tag:water, start: 5.8, end: 7.0, delta: -1.8, ease: expo_in}
      - {type: water_level, target: tag:reservoir, start: 5.8, end: 7.2, delta: -7.0, ease: expo_in}
      - {type: scale, target: tag:jet, start: 5.8, end: 6.1, to: [0.01, 0.01, 0.01]}
    captions:
      - {kind: title, text: "WHAT IF ALL WATER DISAPPEARED?", at: 0.6, until: 5.6}
      - {kind: caption, text: "A HYPOTHETICAL 24 HOURS", at: 6.6, until: 9.6}
    hud: {hours: 0, hours_end: 0, show_at: 6.2, sub: "HYPOTHETICAL SCENARIO"}
    sfx: [{sound: riser, at: 2.4}, {sound: impact, at: 5.8, gain_db: 2}, {sound: whoosh, at: 9.6}]
    music: {intensity: 0.3}
    transition: {type: whip, duration: 0.35}

