# The Day The World Stopped Making Plastic: a hypothetical 24-hour pause in plastic production,
# from the halt at 06:00 through clean-ups, rethinking and a night for nature, to the restart.
# Coordinates: metres in each environment (studio/blender/environments_plastic.py). Production
# lines run along X; shores and rivers lie toward +Y. hud values are hours of the day (project
# hud_wrap: 24): 26 is 02:00 and 30 is 06:00 the next morning.
x-dawn: &dawn {sun: 3.6, elevation: 8, azimuth: 120, colour: [1.0, 0.72, 0.48], zenith: [0.22, 0.40, 0.75], horizon: [0.98, 0.74, 0.55], ambient: 0.55, fog: 0.0004, fog_colour: [0.95, 0.82, 0.68], exposure: -0.05}
x-morning: &morning {sun: 4.8, elevation: 30, azimuth: 150, colour: [1.0, 0.93, 0.82], zenith: [0.18, 0.40, 0.85], horizon: [0.66, 0.76, 0.90], ambient: 0.6, fog: 0.0004, fog_colour: [0.80, 0.86, 0.94], exposure: -0.25}
x-noon: &noon {sun: 4.5, elevation: 68, azimuth: 160, colour: [1.0, 0.98, 0.94], zenith: [0.16, 0.42, 0.88], horizon: [0.72, 0.82, 0.90], ambient: 0.5, fog: 0.0005, fog_colour: [0.88, 0.90, 0.92], exposure: -0.5}
x-evening: &evening {sun: 3.8, elevation: 12, azimuth: -150, colour: [1.0, 0.66, 0.40], zenith: [0.20, 0.30, 0.62], horizon: [0.95, 0.64, 0.42], ambient: 0.45, fog: 0.0006, fog_colour: [0.92, 0.76, 0.60], exposure: -0.1}
x-night: &night {sun: 0.5, elevation: 40, azimuth: 120, colour: [0.62, 0.72, 1.0], zenith: [0.01, 0.016, 0.045], horizon: [0.05, 0.06, 0.11], ambient: 0.3, fog: 0.0004, fog_colour: [0.10, 0.12, 0.18], exposure: 1.4}
x-sunrise: &sunrise {sun: 3.8, elevation: 6, azimuth: 120, colour: [1.0, 0.68, 0.42], zenith: [0.24, 0.42, 0.78], horizon: [0.98, 0.72, 0.52], ambient: 0.55, fog: 0.0005, fog_colour: [0.96, 0.80, 0.64], exposure: -0.05}
x-hall: &hall {sun: 0.0, elevation: 40, azimuth: 0, colour: [1.0, 1.0, 1.0], zenith: [0.55, 0.62, 0.70], horizon: [0.60, 0.62, 0.64], ambient: 0.35, fog: 0.004, fog_colour: [0.80, 0.82, 0.84], exposure: -0.15}
x-room: &room {sun: 0.0, elevation: 40, azimuth: 0, colour: [1.0, 1.0, 1.0], zenith: [0.60, 0.66, 0.74], horizon: [0.70, 0.70, 0.70], ambient: 0.35, fog: 0.0, exposure: -0.4}
x-under: &under {sun: 3.0, elevation: 72, azimuth: 30, colour: [0.80, 0.95, 1.0], zenith: [0.10, 0.35, 0.50], horizon: [0.05, 0.20, 0.30], ambient: 0.7, fog: 0.0, exposure: 0.1}
