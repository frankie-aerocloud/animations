    captions:
      - {kind: title, text: "THE DAY THE WORLD STOPPED MAKING PLASTIC", at: 0.2, until: 2.9}
      - {kind: chapter, text: "06:00 AM", sub: "The great pause", at: 3.0, until: 5.6}
    hud: {hours: 6.0, show_at: 0.3, sub: "PLASTIC PRODUCTION: RUNNING"}
    sfx: [{sound: swell, at: 0.1, gain_db: -8}]
    music: {intensity: 0.4}
    transition: {type: cut, duration: 0.0}

