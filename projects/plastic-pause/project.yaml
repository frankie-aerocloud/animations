id: plastic-pause
title: "The Day The World Stopped Making Plastic"
language: en-GB
hud_label: "THE GREAT PAUSE"
hud_wrap: 24           # time-of-day clock from 06:00 round to 06:00 the next morning
music_style: hopeful
premise: >
  Hypothetical 24-hour pause. Every plastics plant on Earth stops at once. Factories fall silent,
  the world adjusts, communities clean up what is already out there and industry rethinks; then
  production restarts, but something has changed.
render: {}
