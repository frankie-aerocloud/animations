  narration_dir: audio/narration
  music_file: null
  sfx_dir: audio/sfx
  narration: {length_scale: 0.85, noise_w: 0.0}   # brisk enough for the whole script under 180 s; fixed line lengths keep the timing exact
  music: {gain_db: -15}
