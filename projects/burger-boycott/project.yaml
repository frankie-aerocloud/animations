id: burger-boycott
title: "The Month America Ditched McDonald's"
language: en-GB
hud_label: "THE 30-DAY EXPERIMENT"
hud_format: day        # the clock shows DAY n; storyboard hud values are day numbers
music_style: quirky
premise: >
  Hypothetical economic experiment. For one month, Americans stop eating at the biggest fast-food
  chain. Its restaurants go quiet, franchise owners and suppliers feel it, rival chains and local
  businesses pick up the custom, and families change their habits. The chains on screen are generic:
  colour schemes and plain words, never real logos or trade dress.
render: {}
