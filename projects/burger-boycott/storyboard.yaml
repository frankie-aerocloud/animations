# The Month America Ditched McDonald's: a hypothetical 30-day economic experiment. The chains on
# screen are generic (colour schemes and plain words, never real logos or trade dress); only the
# narration names them. Coordinates: metres in each environment (studio/blender/environments_fastfood.py).
# The strip road runs along X; the giant's restaurant faces it from y = +34, the rivals from y = -34.
# hud values are day numbers (project hud_format: day).
x-morning: &morning {sun: 4.4, elevation: 24, azimuth: 140, colour: [1.0, 0.90, 0.76], zenith: [0.18, 0.40, 0.84], horizon: [0.70, 0.78, 0.88], ambient: 0.55, fog: 0.0006, fog_colour: [0.86, 0.88, 0.92], exposure: -0.3}
x-day: &day {sun: 5.0, elevation: 52, azimuth: 160, colour: [1.0, 0.96, 0.90], zenith: [0.16, 0.40, 0.86], horizon: [0.70, 0.80, 0.90], ambient: 0.55, fog: 0.0005, fog_colour: [0.86, 0.88, 0.92], exposure: -0.4}
x-dusk: &dusk {sun: 3.4, elevation: 9, azimuth: -140, colour: [1.0, 0.62, 0.38], zenith: [0.16, 0.22, 0.48], horizon: [0.92, 0.58, 0.40], ambient: 0.45, fog: 0.0008, fog_colour: [0.90, 0.70, 0.55], exposure: -0.05}
x-night: &night {sun: 0.4, elevation: 40, azimuth: 120, colour: [0.60, 0.70, 1.0], zenith: [0.01, 0.015, 0.04], horizon: [0.06, 0.06, 0.10], ambient: 0.3, fog: 0.0006, fog_colour: [0.12, 0.12, 0.18], exposure: 1.2}
x-inside: &inside {sun: 0.0, elevation: 40, azimuth: 0, colour: [1.0, 1.0, 1.0], zenith: [0.60, 0.66, 0.74], horizon: [0.70, 0.70, 0.70], ambient: 0.35, fog: 0.0, exposure: -0.3}
x-evening-in: &evening_in {sun: 0.0, elevation: 40, azimuth: 0, colour: [1.0, 1.0, 1.0], zenith: [0.05, 0.06, 0.10], horizon: [0.08, 0.08, 0.10], ambient: 0.2, fog: 0.0, exposure: 0.2}
