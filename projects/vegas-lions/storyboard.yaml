# Story clock: 06:00 start. The HUD counts DOWN the 24 hours (hours = time remaining).
# Coordinates: metres in each environment (studio/blender/environments_vegas.py). The Strip runs along Y at
# x = 0 (lanes x = +-5/11/17, sidewalks +-22..32); west podium fronts face east at x = -40, east at x = 40.
x-dawn: &dawn {elevation: 6, azimuth: 95, colour: [1.0, 0.72, 0.48], horizon: [0.96, 0.68, 0.46], zenith: [0.30, 0.42, 0.70], ambient: 0.45, fog: 0.0003, fog_colour: [0.95, 0.80, 0.62]}
x-morning: &morning {elevation: 24, azimuth: 105, fog: 0.0004}
x-noon: &noon {fog: 0.0003}
scenes:
