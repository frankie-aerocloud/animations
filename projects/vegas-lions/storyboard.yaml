    duration: 6.0
    environment: {type: mojave, truck: true}
    lighting: golden_hour
    lighting_overrides: *dawn
    camera: {shot: aerial_establish, from: [-40, 760, 55], to: [-22, 580, 30], look: [2.6, 600, 2], look_to: [2.6, 470, 2], lens: 30, fstop: 8}
    captions:
      - {kind: title, text: "WHAT IF ONE MILLION LIONS ATTACKED LAS VEGAS?", at: 0.4, until: 5.6}
    hud: {hours: 24, hours_end: 23.8, show_at: 0.4, sub: "06:00 AM"}
    sfx: [{sound: swell, at: 0.2, gain_db: -8}]
    music: {intensity: 0.2}
    transition: {type: dissolve, duration: 0.4}

