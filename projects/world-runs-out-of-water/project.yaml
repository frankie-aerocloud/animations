project:
  id: world-runs-out-of-water
  title: "What If The World Ran Out Of Water?"
  subtitle: "The First 24 Hours"
  language: en-GB
  stage: quality-control
  target_duration_seconds: 90
  scientific_premise: "Usable freshwater becomes unavailable to human infrastructure; water itself does not disappear from Earth."
render:
  width: 1080
  height: 1920
  fps: 30
  engine: eevee
  profile: preview
  output_format: mp4
scenes:
  - id: opening
    title: "Opening"
    duration: 8
    environment: earth_space
    narration: "Imagine waking up tomorrow... and discovering that the world has run out of usable water."
  - id: hour_1
    title: "Hour 1 — Taps stop delivering"
    duration: 12
    environment: modern_kitchen
    narration: "Within the first hour, taps stop delivering water. Millions of households suddenly realise something is terribly wrong."
  - id: hour_3
    title: "Hour 3 — Panic buying begins"
    duration: 12
    environment: supermarket
    narration: "By hour three, panic buying begins. Bottled water becomes one of the most valuable things in any supermarket."
  - id: hour_6
    title: "Hour 6 — Hospitals under pressure"
    duration: 13
    environment: hospital
    narration: "By hour six, hospitals face a critical problem. Water is essential for hygiene, sanitation and countless medical procedures."
  - id: hour_12
    title: "Hour 12 — Cities struggle"
    duration: 13
    environment: modern_city
    narration: "By midday, cities begin struggling. Water-dependent industries slow down, and essential services come under increasing pressure."
  - id: hour_18
    title: "Hour 18 — Food production is threatened"
    duration: 15
    environment: agricultural_countryside
    narration: "By hour eighteen, agriculture faces an immediate crisis. Without irrigation, crops are already under threat."
  - id: hour_24
    title: "Hour 24 — Water is life"
    duration: 17
    environment: city_horizon
    narration: "After just twenty-four hours, the world hasn't collapsed. But one thing has become painfully clear: civilisation depends on water."
audio:
  narration_dir: "../../assets/audio/narration"
  narration_wav: null
  tts_provider: macos_say
  tts_voice: Daniel
  music: null
  sound_design: procedural_ambient
  sound_effects: [scene_transition_chimes]
  subtitles: "subtitles.srt"
