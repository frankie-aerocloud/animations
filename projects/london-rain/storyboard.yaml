# 365 Days Underwater: recognisable London slowly becoming unliveable, never a drowned city.
# Coordinates: metres in each environment (studio/blender/environments_london.py). Streets run along Y
# (UK traffic keeps left: northbound lane x < 0). Westminster: Elizabeth Tower at (-122, -280), the
# river runs north at x = 30 there. hud values are day numbers (project hud_format: day).
x-rain-day: &rain_day {sun: 1.1, elevation: 52, azimuth: -30, colour: [0.86, 0.90, 1.0], zenith: [0.30, 0.33, 0.37], horizon: [0.52, 0.55, 0.58], ambient: 0.8, fog: 0.0045, fog_colour: [0.56, 0.59, 0.63], exposure: -0.05}
x-rain-dark: &rain_dark {sun: 0.7, elevation: 40, azimuth: -30, colour: [0.80, 0.86, 1.0], zenith: [0.20, 0.22, 0.26], horizon: [0.40, 0.42, 0.45], ambient: 0.6, fog: 0.005, fog_colour: [0.40, 0.42, 0.46], exposure: 0.05}
x-rain-dusk: &rain_dusk {sun: 0.8, elevation: 6, azimuth: -110, colour: [0.95, 0.62, 0.45], zenith: [0.10, 0.12, 0.20], horizon: [0.45, 0.32, 0.30], ambient: 0.45, fog: 0.004, fog_colour: [0.32, 0.28, 0.30], exposure: 0.2}
