x-indoor-grey: &indoor_grey {sun: 0.6, elevation: 30, azimuth: 0, colour: [0.85, 0.90, 1.0], zenith: [0.45, 0.48, 0.52], horizon: [0.55, 0.57, 0.60], ambient: 0.35, exposure: -0.15}
x-dawn: &dawn {sun: 0.4, elevation: 5, azimuth: 100, colour: [1.0, 0.70, 0.45], zenith: [0.25, 0.40, 0.70], horizon: [0.98, 0.72, 0.50], ambient: 0.5, fog: 0.0006, fog_colour: [0.95, 0.80, 0.66], exposure: 0.0}
