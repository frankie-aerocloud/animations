id: london-rain
title: "365 Days Underwater: The London Disaster"
language: en-GB
hud_label: "LONDON"
hud_format: day        # the clock shows DAY n; storyboard hud values are day numbers
music_style: tense
premise: >
  Hypothetical slow-burn disaster. A weather system stalls over southern England and it rains on London
  for a year. The city is never drowned: recognisable London slowly becomes unliveable, one closed
  station, flooded basement and mouldy flat at a time.
render: {}
assets: assets/manifest.yaml
audio:
  narration_dir: audio/narration
  music_file: null
  sfx_dir: audio/sfx
  narration: {length_scale: 0.85}   # the script runs ~3 minutes at a natural pace; this keeps the film under 180 s
  music: {gain_db: -13}             # the rain bed carries this film; louder than the default -16
